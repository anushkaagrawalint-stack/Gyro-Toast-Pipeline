# Nightly Toast pipeline: pull -> input -> drv -> semantic -> output -> reconciliation -> prune -> reports.
#
# GitHub starts scheduled runs late (often hours) and sometimes drops them, so this does NOT depend on the start time:
#   - three slots a day, off the top of the hour (the busiest time on GitHub);
#   - the first step (src/should_run.js) checks the database: if yesterday's business date (store time) is already loaded,
#     the run skips itself; otherwise it does the work - no matter how late it started.
#   09:17 UTC = 3:17 AM CST / 4:17 AM CDT      11:17 UTC and 13:17 UTC = fallbacks
# Manual runs (Run workflow) always run.
name: Nightly Toast pipeline

on:
  schedule:
    - cron: "17 9 * * *"
    - cron: "17 11 * * *"
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Business date YYYYMMDD (blank = yesterday, store time)"
        required: false
        default: ""
      deep:
        description: "Also re-pull the 30-day modified window"
        type: boolean
        default: false

concurrency:
  group: nightly-toast-pipeline
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TOAST_API_HOSTNAME: ${{ secrets.TOAST_API_HOSTNAME }}
      TOAST_USER_ACCESS_TYPE: ${{ secrets.TOAST_USER_ACCESS_TYPE }}
      TOAST_CLIENT_ID: ${{ secrets.TOAST_CLIENT_ID }}
      TOAST_CLIENT_SECRET: ${{ secrets.TOAST_CLIENT_SECRET }}
      TOAST_GUID_FONDREN: ${{ secrets.TOAST_GUID_FONDREN }}
      TOAST_GUID_KATY: ${{ secrets.TOAST_GUID_KATY }}
      TOAST_GUID_MISSOURI_CITY: ${{ secrets.TOAST_GUID_MISSOURI_CITY }}
      TOAST_GUID_PEARLAND: ${{ secrets.TOAST_GUID_PEARLAND }}
      TOAST_GUID_RICHMOND: ${{ secrets.TOAST_GUID_RICHMOND }}
      TOAST_GUID_SPRING_KLEIN: ${{ secrets.TOAST_GUID_SPRING_KLEIN }}
      TOAST_GUID_SUGAR_LAND: ${{ secrets.TOAST_GUID_SUGAR_LAND }}
      REPORT_DIR: ${{ github.workspace }}/reports
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Is yesterday already loaded?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            node src/should_run.js
          else
            echo "manual run - always runs"; echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run nightly pipeline
        if: steps.gate.outputs.run == 'true'
        run: |
          args=""
          if [ -n "${{ github.event.inputs.date }}" ]; then args="$args --date ${{ github.event.inputs.date }}"; fi
          if [ "${{ github.event.inputs.deep }}" = "true" ]; then args="$args --deep"; fi
          node src/nightly.js $args

      - name: Keep the generated reports
        if: steps.gate.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30
