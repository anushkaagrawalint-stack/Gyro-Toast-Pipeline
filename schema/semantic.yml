      source_column: drv_unpaid_amount
      how: own row
- name: sem_order_items
  description: UNION of 5 derived tables, one row per item / modifier / tax / discount / trigger, told apart by row_type. Columns not filled for a row type are empty. (In Excel it is split over 2 sheets
    only because of the row limit - it is ONE table.)
  meta:
    grain: item | modifier | tax | discount | trigger
    union_of:
      item: drv_items
      modifier: drv_modifier
      tax: drv_tax
      discount: drv_discount
      trigger: drv_discount_trigger_item
    joins:
    - drv_order on tenant_location_id + order_id (order business date, revenue center, dining option, service period)
    - 'drv_items on tenant_location_id + item_id (tax rows: menu_name, drv_is_open_item)'
