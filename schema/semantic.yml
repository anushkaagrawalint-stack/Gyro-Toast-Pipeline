# Semantic layer (dbt) - the 4 semantic tables, built ONLY from the 103 derived tables (layers/derived).
# Rule: every column comes from a derived table and exists there under the same name (checked against layers/derived/schema.yml).
# meta.source_table / source_column (or source_by_row_type for sem_order_items) = the build recipe; meta.stands_for_sw_column = the v6 SW column it replaces.
# Customer-specific rules (e.g. Rasa 'CATERING - 3PD' menu fallback) live in report formulas, not in these tables.

version: 2
models:
- name: sem_order_header
  description: One row per order (drv_order). An order with N service charges (drv_service_charge) has N rows; only the charge columns differ, order totals repeat.
  meta:
    grain: order (+ one row per service charge)
    built_from:
    - drv_order
    - 'drv_check (first check: loyalty)'
    - drv_service_charge
    joins:
    - drv_check on tenant_location_id + order_id, check_sequence = 0
    - 'drv_service_charge on tenant_location_id + order_id (left join: orders without charges keep one row)'
    sum_rule: 'order-level money repeats on the extra service-charge rows: count order totals once per tenant_location_id + order_id (the report formulas subtract the rows with source_array_index > 0)'
  data_tests:
  - dbt_utils.expression_is_true:
      expression: order_id is not null
  columns:
  - name: organisation_id
    description: Neon id of the organisation (group) that owns the tenant. Same on every row of one tenant.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: organisation_id
      how: own row
  - name: organisation_slug
    description: Short fixed name of the organisation (e.g. rasa-group).
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: organisation_slug
      how: own row
  - name: tenant_id
    description: Neon id of the tenant (customer) the row belongs to.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: tenant_id
      how: own row
    data_tests:
    - not_null
  - name: tenant_slug
    description: Short fixed name of the tenant (e.g. tenant_rasa) - the same as the GCS tenant folder.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: tenant_slug
      how: own row
  - name: store_location_id
    description: Which restaurant this row is for. Every per-restaurant total depends on it.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: store_location_id
      how: own row
    data_tests:
    - not_null
  - name: tenant_location_id
    description: 'Neon id of the tenant store (tenant_locations.id). Never changes and never repeats, so every join between tables uses it. Not inside the Toast record: the loader sets it from the GCS location
      folder via the store''s location_sources row.'
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: tenant_location_id
      how: own row
    data_tests:
    - not_null
  - name: store_timezone
    description: The restaurant's own time zone (Neon tenant_locations.timezone, e.g. America/New_York). Use it to turn the UTC timestamps into the store's local time and business day.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: store_timezone
      how: own row
  - name: system_id
    description: Neon id of the kind of system the data came from (e.g. POS).
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: system_id
      how: own row
  - name: system_slug
    description: Short fixed name of the system (e.g. pos).
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: system_slug
      how: own row
  - name: source_id
    description: Neon id of the product the data came from (e.g. Toast).
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: source_id
      how: own row
  - name: source_slug
    description: Short fixed name of the source (e.g. toast) - the same as the GCS source folder.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: source_slug
      how: own row
  - name: source_timezone
    description: The time zone the source sends its timestamps in (Neon sources.data_timezone). Toast sends UTC - every Toast timestamp ends in +0000.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: source_timezone
      how: own row
  - name: source_entity_id
    description: Neon id of the feed (catalog entity) the row came from, e.g. Toast orders.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: source_entity_id
      how: own row
  - name: entity_name
    description: Name of the feed the row came from (e.g. orders) - the same as the GCS entity folder.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: entity_name
      how: own row
  - name: _run_id
    description: Id of the nightly run that fetched this row - written by the ETL into every record; the same as Neon connector_runs.run_id.
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: _run_id
      how: own row
  - name: _extracted_at
    description: When the ETL fetched the record from Toast.
    data_type: TIMESTAMP
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: _extracted_at
      how: own row
  - name: _source_type
    description: Source written by the ETL into every record (e.g. toast).
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: _source_type
      how: own row
  - name: _load_mode
    description: 'How the record was loaded: incremental, backfill or invalid.'
    data_type: STRING
    meta:
      stands_for_sw_column: (tenant details)
      source_table: drv_order
      source_column: _load_mode
      how: own row
  - name: order_id
    description: A unique code that names this order. Every check, item, add-on, and payment for the order points back to this code, and it is what order counts are based on.
    data_type: STRING
    meta:
      stands_for_sw_column: order_id
      source_table: drv_order
      source_column: order_id
      how: own row
    data_tests:
    - not_null
    - relationships:
        to: ref('drv_order')
        field: order_id
  - name: order_business_date
    description: 'The restaurant''s trading day for this order, as an integer in YYYYMMDD form. It is not the calendar date: an order rung up at 1am is booked to the previous trading day, using the location''s
      closeout hour. Every daily figure must group on this rather than on a timestamp''s date.'
    data_type: INT64
    meta:
      stands_for_sw_column: order_business_date
      source_table: drv_order
      source_column: order_business_date
      how: own row
  - name: drv_hour_order_opened_at
    description: 'Calculation: HOUR( LOCAL_TIME(o.order_opened_at) )  -- 0..23'
    data_type: INT64
    meta:
      stands_for_sw_column: drv_hour_order_opened_at
      source_table: drv_order
      source_column: drv_hour_order_opened_at
      how: own row
  - name: drv_order_day_of_week
    description: 'The real weekday of the order (not the schedule setting that shares the name day_of_week). Calculation: weekday name (Monday..Sunday) of o.order_business_date (YYYYMMDD, already the store''s
      local business day)'
    data_type: STRING
    meta:
      stands_for_sw_column: drv_order_day_of_week
      source_table: drv_order
      source_column: drv_order_day_of_week
      how: own row
  - name: service_window_name
    description: The name of the restaurant service (a meal period, like Lunch or Dinner), as set up in Toast. This is the label that shows in reports.
    data_type: STRING
    meta:
      stands_for_sw_column: service_period_name
      source_table: drv_order
      source_column: service_window_name
      how: own row
  - name: dining_option_name
    description: The name of the dining option (a way an order is fulfilled, like Dine In or Delivery), as set up in Toast. This is the label that shows in reports.
    data_type: STRING
    meta:
      stands_for_sw_column: dining_option_name
      source_table: drv_order
      source_column: dining_option_name
      how: own row
  - name: revenue_center_name
    description: The name of the revenue centre, as set up in Toast. This is the label that shows in reports.
    data_type: STRING
    meta:
      stands_for_sw_column: revenue_center_name
      source_table: drv_order
      source_column: revenue_center_name
      how: own row
  - name: dining_option_behavior
    description: The underlying fulfilment behaviour of this dining option, dine-in, takeaway or delivery. The name is free text, so this column is the one to group by; two options named differently can
      share one behaviour.
    data_type: STRING
    meta:
      stands_for_sw_column: dining_option_config_behavior
      source_table: drv_order
      source_column: dining_option_behavior
      how: own row
  - name: order_source
    description: The channel the order arrived through, 'In Store' for the till, 'app connection' for outside and delivery-marketplace orders, 'Online Ordering' for Toast's own web ordering. This is the
      column that separates first-party revenue from marketplace revenue, so it drives channel mix and commission analysis.
    data_type: STRING
    meta:
      stands_for_sw_column: order_source
      source_table: drv_order
      source_column: order_source
      how: own row
  - name: drv_order_counted
    description: 'Does this order count as a real order? 1 = yes; 0 = it was voided or has zero guests (Toast leaves zero-guest orders out of its order count). Calculation: 1 IF LIVE_ORDER(o) AND o.guest_count
      >= 1 ELSE 0  -- Toast leaves zero-guest orders out of its order count'
    data_type: INT64
    meta:
      stands_for_sw_column: drv_order_counted
      source_table: drv_order
      source_column: drv_order_counted
      how: own row
  - name: guest_count
    description: The guest count entered for this order. It drives cover counts and average spend per head; marketplace orders default it to one regardless of how many people are actually eating.
    data_type: INT64
    meta:
      stands_for_sw_column: guest_count
      source_table: drv_order
      source_column: guest_count
      how: own row
  - name: drv_gross_sales
    description: 'Add up the menu price of everything really sold on the order, before any discount. Calculation: SUM(drv_items.drv_gross_sales) WHERE drv_items.order_id = o.order_id'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_gross_sales
      source_table: drv_order
      source_column: drv_gross_sales
      how: own row
  - name: drv_discount_amount_total
    description: 'All the money taken off the bill by discounts, whether they were on the whole check or on single items. Calculation: SUM(drv_check.drv_discount) WHERE drv_check.order_id = o.order_id  +  drv_item_discount_total'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_discount_amount_total
      source_table: drv_order
      source_column: drv_discount_amount_total
      how: own row
  - name: drv_item_discount_total
    description: 'Only the discounts that were put on single items (not the ones on the whole check). Calculation: SUM(drv_items.drv_discount) WHERE drv_items.order_id = o.order_id'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_item_discount_total
      source_table: drv_order
      source_column: drv_item_discount_total
      how: own row
  - name: drv_refund_amount
    description: 'How much was handed back to the guest for food/drink, not counting the tax that went back with it. Dated on the ORDER day, not the refund day. Calculation: SUM(drv_payment.drv_refund_net)
      WHERE drv_payment.order_id = o.order_id  -  SUM(i.items_refund_tax_amount) WHERE i.order_id = o.order_id  -- refund without its tax, dated on the order day'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_refund_amount
      source_table: drv_order
      source_column: drv_refund_amount
      how: own row
  - name: drv_net_sales
    description: 'What the order really earned: menu price minus discounts minus refunds. Calculation: drv_gross_sales - drv_discount_amount_total - drv_refund_amount'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_net_sales
      source_table: drv_order
      source_column: drv_net_sales
      how: own row
  - name: drv_tip_amount
    description: 'Tips guests left on this order. Calculation: SUM(drv_payment.drv_tips) WHERE drv_payment.order_id = o.order_id'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_tip_amount
      source_table: drv_order
      source_column: drv_tip_amount
      how: own row
  - name: drv_service_charge_total
    description: 'All service charges (like a delivery fee) added to the order. Calculation: SUM(drv_check.drv_service_charge) WHERE drv_check.order_id = o.order_id'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_service_charge_total
      source_table: drv_order
      source_column: drv_service_charge_total
      how: own row
  - name: drv_tax_amount_total
    description: 'All the tax charged on the order. Calculation: SUM(c.check_tax_amount) WHERE c.order_id = o.order_id AND LIVE_CHECK(c)'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_tax_amount_total
      source_table: drv_order
      source_column: drv_tax_amount_total
      how: own row
  - name: order_duration_seconds
    description: How long the order stayed open, in seconds, from opening to closing. It measures the guest's elapsed time rather than kitchen prep time, so a long value on a dine-in order means a long
      visit, not a slow kitchen.
    data_type: INT64
    meta:
      stands_for_sw_column: order_duration_seconds
      source_table: drv_order
      source_column: order_duration_seconds
      how: own row
  - name: is_order_voided
    description: 'Yes/no: whether the whole order was voided. Voided orders must be excluded from sales and order counts, but are kept because void rate is itself a control metric.'
    data_type: BOOL
    meta:
      stands_for_sw_column: is_order_voided
      source_table: drv_order
      source_column: is_order_voided
      how: own row
  - name: order_void_business_date
    description: The restaurant's trading day on which the order was voided, as an integer in YYYYMMDD form. A void can fall on a later trading day than the sale.
    data_type: INT64
    meta:
      stands_for_sw_column: order_void_business_date
      source_table: drv_order
      source_column: order_void_business_date
      how: own row
  - name: drv_gross_sales_including_voided
    description: 'What the order would have been worth if nothing had been voided. Minus gross_sales it shows the money lost to voids. Calculation: SUM(i.item_price_before_discount) WHERE i.order_id = o.order_id  --
      every item, no live/void/waste/deferred filter'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_gross_sales_including_voided
      source_table: drv_order
      source_column: drv_gross_sales_including_voided
      how: own row
  - name: loyalty_vendor
    description: Which loyalty provider granted this benefit, Toast's own programme or an integrated outside provider.
    data_type: STRING
    meta:
      stands_for_sw_column: drv_loyalty_vendor
      source_table: drv_check
      source_column: loyalty_vendor
      how: 'joined: drv_check on tenant_location_id + order_id where check_sequence = 0 (the order''s first check)'
  - name: loyalty_accrual_family_id
    description: Toast's identifier for the loyalty accrual family this activity counted towards, which groups the rules that decide how points are earned.
    data_type: STRING
    meta:
      stands_for_sw_column: drv_loyalty_accrual_family_id
      source_table: drv_check
      source_column: loyalty_accrual_family_id
      how: 'joined: drv_check on tenant_location_id + order_id where check_sequence = 0 (the order''s first check)'
  - name: loyalty_identifier_masked
    description: The last few digits of the guest's loyalty number, safe to show on receipts and in reports.
    data_type: STRING
    meta:
      stands_for_sw_column: drv_loyalty_identifier_masked
      source_table: drv_check
      source_column: loyalty_identifier_masked
      how: 'joined: drv_check on tenant_location_id + order_id where check_sequence = 0 (the order''s first check)'
  - name: source_array_index
    description: Position of this entry in its list in the Toast record (0 = first). Keeps the original order and tells entries apart when they have no id.
    data_type: STRING
    meta:
      stands_for_sw_column: check_sequence
      source_table: drv_service_charge
      source_column: source_array_index
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: config_service_charge_service_charge_name
    description: The name of the service charge, as set up in Toast. This is the label that shows in reports.
    data_type: STRING
    meta:
      stands_for_sw_column: charge_config_name
      source_table: drv_service_charge
      source_column: config_service_charge_service_charge_name
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: is_gratuity_charge
    description: 'Yes/no: whether this service charge is a gratuity. Gratuities belong to staff and must be kept out of restaurant revenue.'
    data_type: BOOL
    meta:
      stands_for_sw_column: is_gratuity_charge
      source_table: drv_service_charge
      source_column: is_gratuity_charge
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: is_taxable_charge
    description: 'Yes/no: whether the service charge is subject to tax.'
    data_type: BOOL
    meta:
      stands_for_sw_column: is_taxable_charge
      source_table: drv_service_charge
      source_column: is_taxable_charge
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: service_charge_type
    description: 'Yes/no: whether this service charge is a fixed amount, a percentage, or an open amount typed at the till.'
    data_type: STRING
    meta:
      stands_for_sw_column: charge_config_type
      source_table: drv_service_charge
      source_column: service_charge_type
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: service_charge_percent
    description: The percentage rate configured for this service charge, used when amountType is PERCENT.
    data_type: NUMERIC
    meta:
      stands_for_sw_column: charge_config_percent
      source_table: drv_service_charge
      source_column: service_charge_percent
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: check_service_charge_category
    description: Toast's category for this service charge, which decides how it is treated in reporting, as revenue, as a gratuity owed to staff, or as a pass-through.
    data_type: STRING
    meta:
      stands_for_sw_column: check_service_charge_category
      source_table: drv_service_charge
      source_column: check_service_charge_category
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: drv_live_charge_amount
    description: 'The amount of one service charge. A check with two charges has two rows, one per charge. Calculation: s.service_charge_amount IF LIVE_CHECK(c of s.check_id) ELSE 0'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_live_charge_amount
      source_table: drv_service_charge
      source_column: drv_live_charge_amount
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: service_charge_refund_amount
    description: The money refunded against the refund of this service charge, in the restaurant's currency. Refunds are recorded against the original line, so this can be dated later than the sale itself.
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_charge_refund_amount
      source_table: drv_service_charge
      source_column: service_charge_refund_amount
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: drv_charge_refund_date
    description: 'The day the service-charge refund actually happened. Toast reports refunds on that day, not on the sale day. Calculation: p.payment_refund_business_date OF the in_payment p WHERE p.order_id
      = s.order_id AND p.refund_transaction_id = s.service_charge_refund_transaction_id; empty if s.service_charge_refund_transaction_id is empty'
    data_type: INT64
    meta:
      stands_for_sw_column: drv_charge_refund_date
      source_table: drv_service_charge
      source_column: drv_charge_refund_date
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: drv_charge_tax_amount
    description: 'The tax charged on a service charge (for example Bag Tax on a bag fee). Calculation: SUM(t.tax_amount) WHERE t.check_service_charge_id = s.check_service_charge_id AND t.tax_type <> ''EXTERNAL'',
      IF LIVE_CHECK(c) ELSE 0'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_charge_tax_amount
      source_table: drv_service_charge
      source_column: drv_charge_tax_amount
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: drv_charge_tax_name
    description: 'Which tax line that charge tax belongs to. Calculation: t.tax_name OF the first (lowest t.appliedtaxes_sequence) in_tax t WHERE t.check_service_charge_id = s.check_service_charge_id AND
      t.tax_type <> ''EXTERNAL'''
    data_type: STRING
    meta:
      stands_for_sw_column: drv_charge_tax_name
      source_table: drv_service_charge
      source_column: drv_charge_tax_name
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: drv_charge_external_tax_amount
    description: 'Tax on a service charge that a marketplace collects; Toast reports it on its own tax lines. Calculation: SUM(t.tax_amount) WHERE t.check_service_charge_id = s.check_service_charge_id AND
      t.tax_type = ''EXTERNAL'', IF LIVE_CHECK(c) ELSE 0  -- marketplace facilitator tax'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_charge_external_tax_amount
      source_table: drv_service_charge
      source_column: drv_charge_external_tax_amount
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: drv_charge_taxable_amount
    description: 'The amount that was taxed on the charge. Calculation: drv_live_charge_amount IF drv_charge_tax_amount > 0 ELSE 0'
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_charge_taxable_amount
      source_table: drv_service_charge
      source_column: drv_charge_taxable_amount
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: service_charge_refund_tax_amount
    description: The tax portion of the refund on the refund of this service charge. It is tracked separately so tax liability can be reduced without distorting net sales.
    data_type: NUMERIC
    meta:
      stands_for_sw_column: drv_charge_tax_refund_amount
      source_table: drv_service_charge
      source_column: service_charge_refund_tax_amount
      how: one row per service charge of the order (joined on tenant_location_id + order_id)
  - name: drv_has_voided_item
    description: 'Did anyone void an item on this order? Adding these up gives Toast''s "void order count". Calculation: 1 IF EXISTS i WHERE i.order_id = o.order_id AND i.is_item_voided is true ELSE 0'
    data_type: INT64
    meta:
      stands_for_sw_column: drv_has_voided_item
      source_table: drv_order
      source_column: drv_has_voided_item
      how: own row
  - name: drv_unpaid_amount
    description: 'Money still owed: bills rung up but not paid yet. Calculation: SUM(c.check_total_amount) WHERE c.order_id = o.order_id AND LIVE_CHECK(c) AND c.check_payment_status = ''OPEN'''
    data_type: NUMERIC
