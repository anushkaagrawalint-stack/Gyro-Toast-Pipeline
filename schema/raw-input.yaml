# Phase 2 mapper for the Toast input layer (in_* tables) - normalised.
# Built from: POS_Input_Derived_Semantic Structure (2).xlsx (sheet 'Input Layer') and
#             Toast SOR Index (1).xlsx (sheet 'DataDefination'); checked against raw Toast JSON
#             (orders, labor, cash management, config) in ToastOrders/.
#
# HOW A TABLE IS READ
#   row_path   the arrays to walk from the root record; each element reached is one row.
#              [] = the root record itself is the row (e.g. one order per line).
#   rows       used instead of row_path when the same kind of record sits at several places
#              (taxes, discounts). Each entry has its own path and parents; the parent ids that
#              are filled show where the row came from (e.g. item_id null = check-level discount).
#              A path step ending in * is walked recursively to any depth: the same-named array
#              inside each element is walked too (modifiers inside modifiers, groups inside groups).
#              A path step ending in {} is a map (object keyed by id) and is walked over its
#              values, e.g. 'schedules.daySchedules{}'. A dotted step walks through objects.
#   parents    parent values for the row: a path from the ROOT record, read along the walked path
#              (e.g. checks.guid = the check that contains this row). <step>.$index and
#              <step>.$key give the position / map key of an ancestor. Through a * step a path
#              means the innermost element; a leading ^ means the element one level up (null at the top).
#   from       a path inside the ROW element (e.g. guid, salesCategory.guid). Special values:
#                $parent      value comes from `parents` (null when this level has no such parent)
#                $index       position of the row in its array (0-based)
#                $value       the element itself (arrays of plain values; map values)
#                $key         the map key of the row (rows walked from a {} map)
#                $location    store_location_id = the tenant store name; the loader sets it from the
#                             GCS location folder (it is not inside the raw record)
#   type       ID, TEXT, NUMERIC, INT, DATE_INT, BOOLEAN, TIMESTAMP_UTC, JSON_TEXT.
#   key        Unique key of a row. Always starts with store_location_id: each GCS file holds one
#              store, and config / menu / stock ids repeat in every store's file.
#   write_rule only known for in_order (replace_by_order); null elsewhere until decided.
#
# Every array is its own table; nothing from the raw JSON is dropped and nothing is invented:
# the only column not in the raw data is store_location_id (tenant store name).
# Values are kept exactly as Toast sends them: empty text '' stays '', null stays null, 0 stays 0; nothing is trimmed, blanked or converted to empty.
# Tables added beyond
# the Input Layer sheet: in_order_pricing_feature, in_service_charge, in_discount_combo_item, in_config_menu_group_item, in_config_menu_group_modifier_group, in_config_menu_group_subgroup, in_config_menu_group_image, in_config_menu_item_modifier_group, in_config_menu_item_image, in_config_modifier_group_option, in_config_menu_menu_group, in_config_menu_image, in_config_service_charge_tax, in_menus_menu_visibility, in_menus_menu_group_visibility, in_menus_menu_group_tag, in_menus_menu_item_visibility, in_menus_menu_item_tax_rate, in_menus_menu_item_tag, in_menus_menu_item_portion, in_menus_menu_item_modifier_group_ref, in_menus_menu_item_prep_station, in_menus_menu_item_image, in_menus_menu_item_allergen, in_menus_menu_item_payment_assistance, in_menus_menu_item_time_price, in_menus_menu_item_size_sequence_price, in_menus_menu_item_time_price_day, in_menus_menu_item_time_price_range, in_menus_modifier_group_visibility, in_menus_modifier_group_option_ref, in_menus_modifier_option_visibility, in_menus_modifier_option_tax_rate, in_menus_modifier_option_tax_override, in_menus_modifier_option_tag, in_menus_modifier_option_portion, in_menus_modifier_option_modifier_group_ref, in_menus_modifier_option_prep_station, in_menus_modifier_option_allergen, in_menus_pre_modifier_group_refs, in_partner_restaurant_scope, in_partner_connected_restaurant_scope, in_ordering_schedule_override_dining_option, in_ordering_schedule_override_time_range, in_config_discount_promo_code, in_labor_time_entry_break, in_labor_employee_wage_override, in_labor_employee_job.

