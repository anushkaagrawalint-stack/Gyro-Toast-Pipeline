# Semantic lookups (runbook Step 3: "4 fact tables and 2 lookups"): small setup tables taken
# from the most recent setup copy in Derived (sem_calendar is generated), recomputed every night
# and merged on their key. The Output dims dim_date and dim_location read them. The 4 fact tables
# are in _semantic__models.yml (the analytics team's file).

version: 2
models:
- name: sem_calendar
  description: One row per day, generated by dbt (no POS data) - weekday, week, month, quarter, year and last-year dates. The same for every tenant. Output's dim_date reads it.
  meta:
    grain: day
    built_from: []
  columns:
  - name: business_date
    data_type: DATE
    description: The day. Join key to business_date on every fact.
    data_tests: [not_null, unique]
  - {name: date_int, data_type: INT64, description: The day as YYYYMMDD (the integer form the facts use).}
  - {name: day_of_week_code, data_type: STRING, description: Mon .. Sun.}
  - {name: day_of_week_name, data_type: STRING, description: Monday .. Sunday.}
  - {name: day_of_week_number, data_type: INT64, description: Monday = 1 .. Sunday = 7.}
  - {name: is_weekend, data_type: BOOL, description: Saturday or Sunday.}
  - {name: week_start_date, data_type: DATE, description: The Monday the week starts on.}
  - {name: iso_week, data_type: INT64, description: ISO week number (1-53).}
  - {name: month_start_date, data_type: DATE, description: First day of the month.}
  - {name: month_name, data_type: STRING, description: January .. December.}
  - {name: quarter, data_type: INT64, description: 1-4.}
  - {name: year, data_type: INT64, description: Calendar year.}
  - {name: same_weekday_last_year, data_type: DATE, description: 364 days back - the same weekday a year ago (like-for-like comparisons).}
  - {name: same_date_last_year, data_type: DATE, description: The same date a year ago (29 Feb becomes 28 Feb).}

- name: sem_location
  description: One row per store, from its most recent setup copy in drv_location.
  meta:
    grain: store
    built_from: [drv_location]
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns: [tenant_id, store_location_id]
  columns:
  - {name: organisation_id, data_type: STRING, description: Neon id of the organisation that owns the tenant.}
  - {name: organisation_slug, data_type: STRING, description: Short name of the organisation.}
  - name: tenant_id
    data_type: STRING
    description: The tenant (customer) the store belongs to.
    data_tests: [not_null]
  - {name: tenant_slug, data_type: STRING, description: Short name of the tenant.}
  - name: store_location_id
    data_type: STRING
    description: Location ID used everywhere in the pipeline (e.g. loc_rasa_rockville).
    data_tests: [not_null]
  - {name: tenant_location_id, data_type: STRING, description: Neon id of the store.}
  - {name: source_slug, data_type: STRING, description: POS the store's setup came from (toast).}
  - {name: location_guid, data_type: STRING, description: The POS's own id of the restaurant.}
  - {name: location_name, data_type: STRING, description: Store name as set up in the POS.}
  - {name: brand_name, data_type: STRING, description: Brand name as set up in the POS.}
  - {name: location_code, data_type: STRING, description: Short store code from the POS.}
  - {name: restaurant_address, data_type: STRING, description: Store address.}
  - {name: store_timezone, data_type: STRING, description: Store time zone (the registry's, else the POS's).}
  - {name: currency_code, data_type: STRING, description: Currency the store trades in.}
  - {name: closeout_hour, data_type: INT64, description: Hour at which the POS closes the business day.}
  - {name: restaurant_first_business_date, data_type: INT64, description: First business day in the POS (YYYYMMDD).}
  - {name: is_archived, data_type: BOOL, description: The POS has archived the store.}
  - {name: is_online_ordering_enabled, data_type: BOOL, description: Online ordering is on.}
  - {name: is_delivery_enabled, data_type: BOOL, description: Delivery is on.}
  - {name: last_seen_business_date, data_type: DATE, description: Business day of the setup copy this row comes from.}

- name: sem_menu_item
  description: One row per store and menu item, from the item's most recent setup copy in drv_config_menu_item. Items taken off the menu keep their last known values.
  meta:
    grain: store + menu item
    built_from: [drv_config_menu_item]
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns: [tenant_id, store_location_id, menu_item_id]
  columns:
  - {name: organisation_id, data_type: STRING, description: Neon id of the organisation that owns the tenant.}
  - {name: organisation_slug, data_type: STRING, description: Short name of the organisation.}
  - name: tenant_id
    data_type: STRING
    description: The tenant (customer).
    data_tests: [not_null]
  - {name: tenant_slug, data_type: STRING, description: Short name of the tenant.}
  - name: store_location_id
    data_type: STRING
    description: Location ID (e.g. loc_rasa_rockville).
    data_tests: [not_null]
  - {name: tenant_location_id, data_type: STRING, description: Neon id of the store.}
  - {name: source_slug, data_type: STRING, description: POS the item's setup came from (toast).}
  - name: menu_item_id
    data_type: STRING
    description: The POS's own id of the menu item.
    data_tests: [not_null]
  - {name: menu_item_name, data_type: STRING, description: Menu item name as set up in the POS.}
  - {name: menu_item_type, data_type: STRING, description: Item type from the POS.}
  - {name: menu_item_sku, data_type: STRING, description: SKU.}
  - {name: menu_item_price_lookup_code, data_type: STRING, description: Price lookup (PLU) code.}
  - {name: menu_item_visibility, data_type: STRING, description: Where the item is shown (POS, online ...).}
  - {name: is_menu_item_orderable_online, data_type: STRING, description: Whether the item can be ordered online, as the POS sends it.}
  - {name: menu_item_unit_of_measure, data_type: STRING, description: Unit the item is sold by.}
  - {name: menu_item_calories, data_type: NUMERIC, description: Calories.}
  - {name: last_seen_business_date, data_type: DATE, description: Business day of the setup copy this row comes from.}
